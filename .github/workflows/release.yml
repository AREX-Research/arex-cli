name: Release CLI

# Build once, smoke-test the exact files on every native platform, then
# optionally publish those files without rebuilding: the npm tarball to npm
# through trusted publishing (OIDC, no token), and the executables, Skill and
# installer to a GitHub Release. Publishing jobs never check out or run
# repository code. Dispatch from main; its commit identifies workflow and source.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and GitHub Releases (otherwise only build and test)"
        type: boolean
        required: true
        default: false

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Skill validation runs through uvx.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Before the build, so a version clash costs seconds rather than minutes.
      - name: Resolve the version to release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$PUBLISH" = true ]; then
            if gh release view "$version" >/dev/null 2>&1; then
              echo "::error::Release $version already exists. Bump the version in package.json."
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$version"; then
              echo "::error::Tag $version already exists without a release. Bump the version, or delete the stale tag."
              exit 1
            fi
            if [ "$(npm view "@arex-research/cli@$version" version 2>/dev/null)" = "$version" ]; then
              echo "::error::@arex-research/cli@$version is already on npm. Bump the version in package.json."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "previous=$(git tag --sort=-creatordate | head -n 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify and build every artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          npm run validate
          files="$RUNNER_TEMP/release/files"
          mkdir -p "$files"
          npm pack --pack-destination "$files"
          npm run build:binaries
          cp artifacts/arex-* install.sh LICENSE "$files"
          tar -czf "$files/arex-skills-$VERSION.tar.gz" -C skills arex
          (cd "$files" && sha256sum -- * | tee ../SHA256SUMS)

      - name: Write the release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          sdk=$(npm ls @arex-research/ts-sdk --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).dependencies['@arex-research/ts-sdk'].version")
          {
            echo "**Give your agents the power to search, read, and research the web, powered by AREX’s public API.**"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "npm install -g @arex-research/cli@$VERSION"
            echo '```'
            echo
            echo "Or, without Node.js, on macOS, Linux and WSL:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/install.sh | AREX_VERSION=$VERSION sh"
            echo '```'
            echo
            echo "Files are listed in SHA256SUMS. Built with @arex-research/ts-sdk $sdk."
            echo
            echo "## What's changed"
            echo
            git log --no-merges --pretty='- %s' ${PREVIOUS:+"$PREVIOUS..HEAD"}
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$VERSION"
            fi
          } > "$RUNNER_TEMP/release/notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  smoke-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Install and check the npm tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node scripts/check-release.mjs \
            --package "$RUNNER_TEMP/release/files/arex-research-cli-$VERSION.tgz" \
            --expected-version "$VERSION" --sums "$RUNNER_TEMP/release/SHA256SUMS"

  smoke-binary:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: arex-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: arex-linux-arm64 }
          - { os: macos-latest, asset: arex-darwin-arm64 }
          - { os: macos-15-intel, asset: arex-darwin-x64 }
          - { os: windows-latest, asset: arex-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      # Node only drives the checker; the executable runs on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Check the ${{ matrix.asset }} executable
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          node scripts/check-release.mjs \
            --binary "$RUNNER_TEMP/release/files/$ASSET" \
            --expected-version "$VERSION" --sums "$RUNNER_TEMP/release/SHA256SUMS"

  publish-npm:
    if: inputs.publish
    needs: [build, smoke-package, smoke-binary]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - run: cd release/files && sha256sum --check ../SHA256SUMS
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.16.0
      - name: Publish the tested npm tarball using OIDC
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "release/files/arex-research-cli-$VERSION.tgz" --access public --ignore-scripts --registry https://registry.npmjs.org/

  release:
    if: inputs.publish
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - run: cd release/files && sha256sum --check ../SHA256SUMS
      - name: Publish the artifacts to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.build.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$VERSION" release/files/* release/SHA256SUMS \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file release/notes.md
